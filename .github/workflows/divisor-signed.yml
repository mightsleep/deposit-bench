name: divisor-signed
"on":
  push:
    paths: [divisor-signed/**, .github/workflows/divisor-signed.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: CPU
      run: |
        if command -v lscpu > /dev/null; then
          lscpu | grep -E "Model name|Architecture" | cut -c1-200
        else
          echo "Model name: $(sysctl -n machdep.cpu.brand_string)"
        fi
    - name: bench
      run: sh divisor-signed/run.sh
